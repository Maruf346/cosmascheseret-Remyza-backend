# ============================================================
# CI/CD Pipeline - Remyza / Chesara Backend
# Triggers on push to main branch
# Builds Docker image -> pushes to ECR -> deploys to EC2
# ============================================================
name: Deploy to Production

on:
  push:
    branches:
      - main

env:
  AWS_REGION:       ${{ vars.AWS_REGION }}
  ECR_REPOSITORY:   ${{ vars.ECR_REPOSITORY }}
  IMAGE_TAG:        ${{ github.sha }}

jobs:
  # ----------------------------------------------------------
  # JOB 1: Build & Push Docker image to AWS ECR
  # ----------------------------------------------------------
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -f Dockerfile.prod \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    outputs:
      image: ${{ steps.build-image.outputs.image }}

  # ----------------------------------------------------------
  # JOB 2: Deploy to EC2 via SSH
  # ----------------------------------------------------------
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:        ${{ secrets.EC2_HOST }}
          username:    ${{ secrets.EC2_USER }}
          key:         ${{ secrets.EC2_SSH_KEY }}
          port:        22
          script: |
            set -e

            # Authenticate Docker to ECR
            aws ecr get-login-password --region ${{ vars.AWS_REGION }} | \
              docker login --username AWS \
              --password-stdin ${{ secrets.ECR_REGISTRY }}

            # Pull the latest image
            docker pull ${{ secrets.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:latest

            # Navigate to the app directory
            cd /home/${{ secrets.EC2_USER }}/app

            # Update docker-compose to use the new image
            export DOCKER_IMAGE=${{ secrets.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}
            export IMAGE_TAG=latest

            # Restart containers with zero-downtime
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Remove dangling images to free disk space
            docker image prune -f

            echo "Deployment complete: ${{ needs.build-and-push.outputs.image }}"
