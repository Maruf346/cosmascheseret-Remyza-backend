services:
  redis:
    image: redis:7-alpine
    container_name: cheshara_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cheshara_backend

    command: >
      sh -c "
      python manage.py migrate &&
      gunicorn cheshara_config.wsgi:application
      --bind 0.0.0.0:8005
      --workers 3
      --threads 2
      --timeout 120
      "

    volumes:
      - .:/app

    ports:
      - "8005:8005"

    env_file:
      - .env

    depends_on:
      - redis

    restart: always

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cheshara_worker
    command: celery -A cheshara_config worker --loglevel=info --queues=sentdm,celery
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - backend
    restart: always
