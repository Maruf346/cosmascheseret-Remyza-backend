# ============================================================
# Nginx Configuration - Remyza / Chesara Backend
# Place this at /etc/nginx/sites-available/remyza on EC2
# Then: sudo ln -s /etc/nginx/sites-available/remyza /etc/nginx/sites-enabled/
# ============================================================

upstream django_backend {
    server 127.0.0.1:8005;
}

# --- Redirect all HTTP to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name api.remyza.com;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS Server ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.remyza.com;

    # ----- SSL Certificates (Certbot managed) -----
    ssl_certificate     /etc/letsencrypt/live/api.remyza.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.remyza.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ----- Security Headers -----
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header Referrer-Policy           "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ----- Client Upload Size (match Django DATA_UPLOAD_MAX_MEMORY_SIZE) -----
    client_max_body_size 200M;

    # ----- Proxy to Gunicorn -----
    location / {
        proxy_pass          http://django_backend;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ----- Static Files (served by WhiteNoise, but also directly via nginx) -----
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ----- Gzip Compression -----
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    # ----- Logging -----
    access_log /var/log/nginx/remyza_access.log;
    error_log  /var/log/nginx/remyza_error.log warn;
}
